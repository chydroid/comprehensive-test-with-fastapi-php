# 前端控制器重写（部署必配）
#
# 本项目为前端控制器架构：public/index.php 是唯一 PHP 入口，
# /api/*、/admin、/teacher、/exam 等动态路由必须由 Web 服务器
# 把"不存在的文件/目录"请求重写到 index.php，否则这些路径会 404。
#
# 路由按 $_SERVER['REQUEST_URI'] 匹配（core/Request.php:48），
# nginx 内部重写到 /index.php 时会保留原始 URI（含 query string），无需额外处理。

# ============================================================
# ① 宝塔面板（推荐，直接粘贴到「站点设置 → 伪静态」）
#   注意：宝塔伪静态嵌在 server{} 内，不能写 location / 块，
#   否则与宝塔自带主 location / 冲突报 duplicate location，站点打不开。
# ============================================================
if (!-e $request_filename) {
    rewrite ^(.*)$ /index.php last;
}

# ============================================================
# ② 手工 Nginx（放进 server{} 内，或 include 该文件）
#   try_files 只能写在 location 块里，手工配置时把整段放进 server{}。
# ============================================================
# location / {
#     try_files $uri $uri/ /index.php?$query_string;
# }

# ============================================================
# ③ Apache 备用（public/.htaccess，需 AllowOverride All）
# ============================================================
# <IfModule mod_rewrite.c>
#   RewriteEngine On
#   RewriteCond %{REQUEST_FILENAME} !-f
#   RewriteCond %{REQUEST_FILENAME} !-d
#   RewriteRule ^ index.php [QSA,L]
# </IfModule>
