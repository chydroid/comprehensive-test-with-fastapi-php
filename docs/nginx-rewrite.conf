# Nginx 前端控制器重写（部署必配）
#
# 本项目为前端控制器架构：public/index.php 是唯一 PHP 入口，
# /api/*、/admin、/teacher、/exam 等动态路由必须由 Web 服务器
# 把"不存在的文件/目录"请求重写到 index.php（等价于本地
# `php -S ... -t public public/router.php` 的行为）。
#
# 用法（宝塔面板）：网站 → 站点设置 → 伪静态 → 粘贴本文件内容；
# 用法（手工 Nginx）：放进站点 server{} 内，或 include 进
#   /conf/vhost/rewrite/<域名>/ 目录，然后 nginx -t && nginx -s reload。

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ---- Apache 备用写法（public/.htaccess，需 AllowOverride All）----
